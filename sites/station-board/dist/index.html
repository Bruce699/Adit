<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New York Station Boards</title>
<meta name="description" content="496 MTA station boards with synchronized 3D perspective and shared lighting and texture.">
<style>
*{box-sizing:border-box}html{background:#f6f5f2;color:#222;font:14px Arial,Helvetica,sans-serif}body{margin:0;overflow:hidden}#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}#viewport:active{cursor:grabbing}#boards{position:absolute;left:0;top:0;display:grid;transform-origin:0 0;will-change:transform}.board{width:320px;aspect-ratio:4.7;cursor:move;outline-offset:4px}.board:focus-visible{outline:2px solid #777}#viewport.is-dragging .board{outline:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#scene{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}header,footer{position:fixed;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 28px;pointer-events:none}header{top:0}header>div{background:var(--canvas-background,#f6f5f2);padding:10px;margin:-10px;border-radius:8px}footer{background:var(--canvas-background,#f6f5f2)}header h1{font-size:14px;font-weight:500;margin:0;letter-spacing:-.2px}header span{display:block;font-size:11px;color:#777;margin-top:5px}footer{bottom:0;color:#777;font-size:11px}footer a{color:inherit;pointer-events:auto}.zoom-bar{display:flex;align-items:center;gap:3px;padding:5px;border:1px solid #deddd8;background:rgba(255,255,255,.95);border-radius:10px;pointer-events:auto;box-shadow:0 3px 12px #00000006}.zoom-bar button{font:inherit;color:#333;background:none;border:0;border-radius:5px;height:30px;padding:0 10px;cursor:pointer}.zoom-bar button:hover{background:#eee}.zoom-bar button:focus-visible{outline:2px solid #777}.zoom-bar #zoom-in,.zoom-bar #zoom-out{font-size:20px;width:30px;padding:0}#zoom-level{display:inline;min-width:44px;text-align:center;margin:0;font-size:11px;color:#555}.divider{height:16px;border-left:1px solid #ddd;margin:0 3px}#error{position:fixed;top:80px;left:28px;z-index:3;background:#fff;padding:20px}@media(max-width:600px){header{padding:16px;align-items:flex-start}header h1{font-size:12px}header span{max-width:145px;line-height:1.5}footer{padding:16px;font-size:10px}.zoom-bar{gap:0}.zoom-bar button{padding:0 6px}#actual-size{display:none}.hint{max-width:65%;line-height:1.5}}
</style>
</head>
<body>
<header>
 <div><h1>New York Station Boards</h1><span id="caption">Loading stations…</span></div>
 <nav class="zoom-bar" aria-label="Canvas zoom">
  <button id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button><span id="zoom-level" aria-live="polite">100%</span><button id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <span class="divider"></span><button id="fit" title="Fit composition (0)">Fit</button><button id="actual-size" title="View at full size">100%</button>
 </nav>
</header>
<div id="viewport"><main id="boards" aria-label="All MTA station boards. Drag a sign to tilt all signs. Drag the background to pan. Scroll to pan horizontally or vertically. Pinch to zoom. Use arrow keys on a focused sign to tilt."></main></div>
<canvas id="scene" aria-hidden="true"></canvas>
<p id="error" role="alert" hidden></p>
<footer><span class="hint">Scroll to pan · Pinch to zoom · Drag a sign to tilt</span><a href="https://data.ny.gov/Transportation/MTA-Subway-Stations/39hk-dx4f" target="_blank" rel="noopener">MTA station data ↗</a></footer>
<script src="assets/three.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
