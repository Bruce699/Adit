<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New York Station Boards</title>
<meta name="description" content="496 MTA station boards with synchronized 3D perspective and shared lighting and texture.">
<style>
*{box-sizing:border-box}html{background:#fff;color:#222;font:14px Arial,Helvetica,sans-serif}body{margin:0}#boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:52px 32px;padding:72px 44px 110px;max-width:2400px;margin:auto}.board{aspect-ratio:3.5;touch-action:pan-y;cursor:grab;outline-offset:8px}.board:active{cursor:grabbing}.board:focus-visible{outline:2px solid #777}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#scene{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:15px 24px;background:rgba(255,255,255,.94);color:#777;font-size:12px;pointer-events:none}footer a{color:inherit;pointer-events:auto}#error{padding:32px} @media(max-width:600px){#boards{padding:48px 12px 90px;gap:28px}footer{padding:12px;flex-wrap:wrap}}
</style>
</head>
<body>
<h1 class="sr-only">New York station boards, synchronized perspective study</h1>
<main id="boards" aria-label="All MTA station boards. Drag any board to tilt every board. Use arrow keys on a focused board to adjust the shared angle."></main>
<canvas id="scene" aria-hidden="true"></canvas>
<p id="error" role="alert" hidden></p>
<footer><span id="caption">Loading stations…</span><a href="https://data.ny.gov/Transportation/MTA-Subway-Stations/39hk-dx4f" target="_blank" rel="noopener">MTA station data</a></footer>
<script src="assets/three.min.js"></script>
<script src="app.js"></script>
</body></html>
