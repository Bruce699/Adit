name: Adit
options:
  bundleIdPrefix: studio.adit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Adit:
    type: application
    platform: iOS
    sources: [Adit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.adit.transit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMotionUsageDescription: Adit uses device motion to give signs and posters a tilt-responsive sense of depth.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  AditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AditUITests]
    dependencies:
      - target: Adit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Adit:
    build:
      targets:
        Adit: all
    test:
      targets: [AditUITests]
